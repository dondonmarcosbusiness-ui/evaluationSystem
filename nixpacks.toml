[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.pdo_sqlite", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.intl", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.fileinfo", "php82Extensions.tokenizer", "composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --optimize-autoloader", "npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
# schedule:work runs the daily db:backup / online-peak:sample / evaluation-schedules:tick
# tasks (Railway has no cron); queue:work sends the queued notifications. Both are
# backgrounded *after* migrate so the shell's foreground process stays `artisan serve`.
cmd = "php artisan config:clear && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && (php artisan schedule:work &) && (php artisan queue:work --tries=1 --timeout=0 &) && php artisan serve --host=0.0.0.0 --port=$PORT"
