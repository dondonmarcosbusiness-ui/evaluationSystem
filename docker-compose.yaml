services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: evaluation_app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
    volumes:
      - webroot:/webroot
      - app-storage:/var/www/html/storage
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - webroot:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    expose:
      - "80"

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nginx

  # Uncomment these (and set QUEUE_CONNECTION=database in .env) when you need
  # background jobs + the daily db:backup schedule in production.
  #
  # queue:
  #   image: evaluation_app:latest
  #   restart: unless-stopped
  #   command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
  #   env_file:
  #     - .env
  #   environment:
  #     DB_CONNECTION: mysql
  #     DB_HOST: mariadb
  #     DB_PORT: "3306"
  #   volumes:
  #     - app-storage:/var/www/html/storage
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy
  #
  # schedule:
  #   image: evaluation_app:latest
  #   restart: unless-stopped
  #   command: php artisan schedule:work
  #   env_file:
  #     - .env
  #   environment:
  #     DB_CONNECTION: mysql
  #     DB_HOST: mariadb
  #     DB_PORT: "3306"
  #   volumes:
  #     - app-storage:/var/www/html/storage
  #   depends_on:
  #     mariadb:
  #       condition: service_healthy

volumes:
  webroot:
  app-storage:
  db-data:
  caddy-data:
  caddy-config:
