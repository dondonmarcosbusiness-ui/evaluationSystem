server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 20M;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Serve existing static files, otherwise hand everything to Laravel (SPA)
    location / {
        try_files $uri @laravel;
    }

    location @laravel {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    }

    location = /favicon.ico { access_log off; log_not_found off; access_log off; }
    location = /robots.txt  { access_log off; log_not_found off; access_log off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
